services:
  postgres-gs:
    hostname: postgres-gs
    image: postgres:18.6-trixie
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: gis_sentinel
    networks:
      - dev-net
networks:
  dev-net:
    name: dev-net
    external: true
