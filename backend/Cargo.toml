[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
dotenvy = "0.15"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
headers = "0.4"
mime_guess = "2.0.5"
rust-embed = "8.5.0"
serde = { version = "1.0.217", features = ["derive"]}
serde_json = "1.0.134"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.27"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
# Valkey/Redis queue client + pooled connections (task 1.2)
redis = { version = "0.27", features = ["tokio-comp"] }
deadpool-redis = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# typed validation of API request DTOs (task 2.1)
validator = { version = "0.19", features = ["derive"] }
# typed derive-based error enums (task 2.1)
thiserror = "2"
# application-bootstrap error handling in main.rs (task 2.1)
anyhow = "1"
# absolute URL parsing for request validation (task 2.1)
url = "2"
# dyn-compatible async traits for the repository/queue abstractions (see docs/tests.md)
async-trait = "0.1.92"

[features]
# Compile/run the live-service smoke tests: `cargo test --features smoke-tests -- --ignored`.
smoke-tests = []
# Export in-memory fakes of the repo/queue traits for use by integration tests.
test-utils = []

[[test]]
name = "db_smoke"
required-features = ["smoke-tests"]

[[test]]
name = "queue_smoke"
required-features = ["smoke-tests"]

[[test]]
name = "api_alert_points"
required-features = ["test-utils"]
